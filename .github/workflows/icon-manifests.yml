name: Check icon manifests

on:
  push:
    paths:
      - "Icons/**"
      - "tools/sync_icon_manifests.py"
      - ".github/workflows/icon-manifests.yml"
  pull_request:
    paths:
      - "Icons/**"
      - "tools/sync_icon_manifests.py"
      - ".github/workflows/icon-manifests.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check generated icon manifests
        run: python3 tools/sync_icon_manifests.py --check
